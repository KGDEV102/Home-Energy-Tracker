server:
  port: ${SERVER_PORT:8082}
spring:
  config:
    import: optional:file:device-service/.env[.properties],optional:file:.env[.properties]
  application:
    name: device-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    location: classpath:db/migration

jwt:
  public-key: ${JWT_PUBLIC_KEY_BASE64}

internal:
  service-token: ${DEVICE_SERVICE_INTERNAL_TOKEN}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
  paths-to-match: /api/v1/**
