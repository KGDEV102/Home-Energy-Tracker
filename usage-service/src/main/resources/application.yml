server:
  port: ${SERVER_PORT:8084}

spring:
  config:
    import: optional:file:usage-service/.env[.properties],optional:file:.env[.properties]
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:usage-service-v1}
      client-id: ${KAFKA_CONSUMER_CLIENT_ID:usage-service-consumer}
      enable-auto-commit: false
      auto-offset-reset: earliest

      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.homeenergytracker.common.event.EnergyUsageEvent
        spring.json.trusted.packages: com.homeenergytracker.common.event
        allow.auto.create.topics: false

    listener:
      ack-mode: record

usage:
  kafka:
    topic: ${USAGE_KAFKA_TOPIC:energy-usage.v1}
    dlt-topic: ${USAGE_KAFKA_DLT_TOPIC:energy-usage.v1-dlt}
    retry-attempts: ${USAGE_KAFKA_RETRY_ATTEMPTS:2}
    retry-interval-ms: ${USAGE_KAFKA_RETRY_INTERVAL_MS:1000}


influxdb:
  url: ${INFLUXDB_URL:http://localhost:8086}
  token: ${INFLUXDB_TOKEN}
  org: ${INFLUXDB_ORG:home-energy-tracker}
  bucket: ${INFLUXDB_BUCKET:energy-usage}

jwt:
  # Base64 DER X.509 public key shared with user-service.
  public-key: ${JWT_PUBLIC_KEY_BASE64}

internal:
  usage-service-token: ${USAGE_SERVICE_INTERNAL_TOKEN}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
  paths-to-match: /api/v1/**
