server:
  port: ${SERVER_PORT:8080}

spring:
  config:
    import: optional:file:api-gateway/.env[.properties],optional:file:.env[.properties]

  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: gatewayUserService
                    fallbackUri: forward:/fallback/user-service
                    statusCodes:
                      - INTERNAL_SERVER_ERROR
                      - NOT_IMPLEMENTED
                      - BAD_GATEWAY
                      - SERVICE_UNAVAILABLE
                      - GATEWAY_TIMEOUT
                      - HTTP_VERSION_NOT_SUPPORTED
                      - VARIANT_ALSO_NEGOTIATES
                      - INSUFFICIENT_STORAGE
                      - LOOP_DETECTED
                      - NOT_EXTENDED
                      - NETWORK_AUTHENTICATION_REQUIRED
            - id: device-service
              uri: ${DEVICE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/device/**,/api/v1/device-models/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: gatewayDeviceService
                    fallbackUri: forward:/fallback/device-service
                    statusCodes:
                      - INTERNAL_SERVER_ERROR
                      - NOT_IMPLEMENTED
                      - BAD_GATEWAY
                      - SERVICE_UNAVAILABLE
                      - GATEWAY_TIMEOUT
                      - HTTP_VERSION_NOT_SUPPORTED
                      - VARIANT_ALSO_NEGOTIATES
                      - INSUFFICIENT_STORAGE
                      - LOOP_DETECTED
                      - NOT_EXTENDED
                      - NETWORK_AUTHENTICATION_REQUIRED
            - id: usage-service
              uri: ${USAGE_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/usages/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: gatewayUsageService
                    fallbackUri: forward:/fallback/usage-service
                    statusCodes:
                      - INTERNAL_SERVER_ERROR
                      - NOT_IMPLEMENTED
                      - BAD_GATEWAY
                      - SERVICE_UNAVAILABLE
                      - GATEWAY_TIMEOUT
                      - HTTP_VERSION_NOT_SUPPORTED
                      - VARIANT_ALSO_NEGOTIATES
                      - INSUFFICIENT_STORAGE
                      - LOOP_DETECTED
                      - NOT_EXTENDED
                      - NETWORK_AUTHENTICATION_REQUIRED
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/notification-rules/**,/api/v1/notifications/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: gatewayNotificationService
                    fallbackUri: forward:/fallback/notification-service
                    statusCodes:
                      - INTERNAL_SERVER_ERROR
                      - NOT_IMPLEMENTED
                      - BAD_GATEWAY
                      - SERVICE_UNAVAILABLE
                      - GATEWAY_TIMEOUT
                      - HTTP_VERSION_NOT_SUPPORTED
                      - VARIANT_ALSO_NEGOTIATES
                      - INSUFFICIENT_STORAGE
                      - LOOP_DETECTED
                      - NOT_EXTENDED
                      - NETWORK_AUTHENTICATION_REQUIRED
            - id: insight-service
              uri: ${INSIGHT_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/insights/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: gatewayInsightService
                    fallbackUri: forward:/fallback/insight-service
                    statusCodes:
                      - INTERNAL_SERVER_ERROR
                      - NOT_IMPLEMENTED
                      - BAD_GATEWAY
                      - SERVICE_UNAVAILABLE
                      - GATEWAY_TIMEOUT
                      - HTTP_VERSION_NOT_SUPPORTED
                      - VARIANT_ALSO_NEGOTIATES
                      - INSUFFICIENT_STORAGE
                      - LOOP_DETECTED
                      - NOT_EXTENDED
                      - NETWORK_AUTHENTICATION_REQUIRED

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

resilience4j:
  circuitbreaker:
    configs:
      gatewayDefault:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${GATEWAY_CB_WINDOW_SIZE:10}
        minimum-number-of-calls: ${GATEWAY_CB_MIN_CALLS:5}
        failure-rate-threshold: ${GATEWAY_CB_FAILURE_RATE:50}
        wait-duration-in-open-state: ${GATEWAY_CB_OPEN_WAIT:30s}
        permitted-number-of-calls-in-half-open-state: ${GATEWAY_CB_HALF_OPEN_CALLS:2}
        register-health-indicator: true
    instances:
      gatewayUserService:
        base-config: gatewayDefault
      gatewayDeviceService:
        base-config: gatewayDefault
      gatewayUsageService:
        base-config: gatewayDefault
      gatewayNotificationService:
        base-config: gatewayDefault
      gatewayInsightService:
        base-config: gatewayDefault

  timelimiter:
    configs:
      gatewayDefault:
        timeout-duration: ${GATEWAY_TIMEOUT:5s}
        cancel-running-future: true
    instances:
      gatewayUserService:
        base-config: gatewayDefault
      gatewayDeviceService:
        base-config: gatewayDefault
      gatewayUsageService:
        base-config: gatewayDefault
      gatewayNotificationService:
        base-config: gatewayDefault
      gatewayInsightService:
        base-config: gatewayDefault
        timeout-duration: ${GATEWAY_INSIGHT_TIMEOUT:30s}
