server:
  port: ${SERVER_PORT:8081}

spring:
  config:
    import: optional:file:user-service/.env[.properties],optional:file:.env[.properties]
  application:
    name: user-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  # Base64 DER: private key is PKCS#8, public key is X.509 (same RSA pair).
  private-key: ${JWT_PRIVATE_KEY_BASE64}
  public-key: ${JWT_PUBLIC_KEY_BASE64}
  # Keep the existing JwtService convention: milliseconds.
  expiration: ${JWT_EXPIRATION_MILLIS:900000}

refresh-token:
  # 30 days, in milliseconds.
  expiration: ${REFRESH_TOKEN_EXPIRATION_MILLIS:2592000000}

auth:
  cookie:
    # Set false only for local HTTP development. Production must use HTTPS.
    secure: ${AUTH_COOKIE_SECURE:true}

internal:
  user-service-token: ${USER_SERVICE_INTERNAL_TOKEN}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
  paths-to-match: /api/v1/**
