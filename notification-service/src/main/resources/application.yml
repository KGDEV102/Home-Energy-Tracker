server:
  port: ${SERVER_PORT:8085}

spring:
  config:
    import: optional:file:notification-service/.env[.properties],optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  # Base64 DER X.509 public key shared with user-service.
  public-key: ${JWT_PUBLIC_KEY_BASE64}

internal:
  user-service-token: ${USER_SERVICE_INTERNAL_TOKEN}

resilience4j:
  circuitbreaker:
    instances:
      smtpMail:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${SMTP_CB_WINDOW_SIZE:10}
        minimum-number-of-calls: ${SMTP_CB_MIN_CALLS:5}
        failure-rate-threshold: ${SMTP_CB_FAILURE_RATE:50}
        wait-duration-in-open-state: ${SMTP_CB_OPEN_WAIT:60s}
        permitted-number-of-calls-in-half-open-state: ${SMTP_CB_HALF_OPEN_CALLS:2}
        slow-call-duration-threshold: ${SMTP_CB_SLOW_DURATION:5s}
        slow-call-rate-threshold: ${SMTP_CB_SLOW_RATE:50}
        record-exceptions:
          - org.springframework.mail.MailException

      userService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${USER_SERVICE_CB_WINDOW_SIZE:10}
        minimum-number-of-calls: ${USER_SERVICE_CB_MIN_CALLS:5}
        failure-rate-threshold: ${USER_SERVICE_CB_FAILURE_RATE:50}
        wait-duration-in-open-state: ${USER_SERVICE_CB_OPEN_WAIT:20s}
        permitted-number-of-calls-in-half-open-state: ${USER_SERVICE_CB_HALF_OPEN_CALLS:2}
        slow-call-duration-threshold: ${USER_SERVICE_CB_SLOW_DURATION:2s}
        slow-call-rate-threshold: ${USER_SERVICE_CB_SLOW_RATE:50}
        record-exceptions:
          - com.homeenergytracker.notificationservice.exception.UserServiceUnavailableException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html
  paths-to-match: /api/v1/**
