spring.application.name=notification-service

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.protocol=smtp
spring.mail.default-encoding=UTF-8
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

notification.mail.from=${MAIL_FROM:no-reply@homeenergytracker.local}
notification.delivery.max-attempts=${NOTIFICATION_MAX_ATTEMPTS:5}
notification.delivery.poll-delay-ms=${NOTIFICATION_POLL_DELAY_MS:10000}
notification.delivery.batch-size=${NOTIFICATION_BATCH_SIZE:50}
notification.delivery.claim-lease-ms=${NOTIFICATION_CLAIM_LEASE_MS:300000}
notification.delivery.worker-id=${NOTIFICATION_WORKER_ID:${random.uuid}}

spring.http.serviceclient.user-service.base-url=${USER_SERVICE_URL:http://localhost:8081}
spring.http.serviceclient.user-service.connect-timeout=2s
spring.http.serviceclient.user-service.read-timeout=3s

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:notification-service-v1}
spring.kafka.consumer.client-id=${KAFKA_CONSUMER_CLIENT_ID:notification-service-consumer}
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.homeenergytracker.common.event.EnergyUsageEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=com.homeenergytracker.common.event
spring.kafka.consumer.properties.allow.auto.create.topics=false
spring.kafka.listener.ack-mode=record

notification.kafka.energy-usage-topic=${NOTIFICATION_ENERGY_USAGE_TOPIC:energy-usage.v1}
